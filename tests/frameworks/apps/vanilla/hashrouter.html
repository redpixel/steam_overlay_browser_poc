<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>vanilla - hand-written hash router</title>
<script src="/overlay-bridge.js"></script>
<script src="/common/test-echo.js"></script>
</head>
<body>
<h1>Vanilla hash router</h1>
<p id="status"></p>
<script>
  // Typical hand-written router: '#/event/7?tab=2'
  function route() {
    var h = location.hash.replace(/^#/, '') || '/';
    var q = h.indexOf('?');
    var p = q === -1 ? h : h.slice(0, q);
    var query = {};
    (q === -1 ? '' : h.slice(q + 1)).split('&').filter(Boolean).forEach(function (kv) {
      var parts = kv.split('=');
      query[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
    });
    var m = /^\/event\/([^/]+)$/.exec(p);
    window.__routerState = { path: p, query: query, hash: location.hash, id: m ? m[1] : null };
    document.getElementById('status').textContent = JSON.stringify(window.__routerState);
  }
  window.__testNavigate = function (p) { location.hash = '#' + p; };
  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
